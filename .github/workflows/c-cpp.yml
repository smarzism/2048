name: C Game Build

on:
  push:
    branches:
      - mainBranch
  pull_request:
    branches:
      - mainBranch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install GCC
      run: sudo apt-get install build-essential

    - name: Compile C Game
      run: gcc -o game game.c

    - name: Upload compiled game as artifact
      uses: actions/upload-artifact@v2
      with:
        name: game-executable
        path: game
